# WebSocket URL of the F-Chat server.
server_url: wss://chat.f-list.net/chat2
# Base URL of the F-List website. Used for API tickets and profile links.
site_url: https://www.f-list.net
# Base URL of the F-List static content server. Used for avatars and eicons.
static_url: https://static.f-list.net

# How long to wait (in milliseconds) for an error response after sending a message.
# F-Chat doesn't confirm successful messages, so errors (like flood control or
# "character not found") can only be matched to a message by timing.
# Higher values catch more errors, but make sending slower.
error_wait_ms: 1000

# Maximum number of members for which the channel member list is synced to Matrix.
# Large public channels (like Frontpage) can have thousands of characters, and
# syncing all of them creates a lot of ghost users and join/leave events.
# In channels above the limit, characters only appear once they send a message.
# 0 means no limit, -1 disables member list syncing entirely.
member_sync_limit: 200

# Should roleplay ads (LRP) be bridged to Matrix? This is the default; users can change it
# per character and per room with the `ads` command.
bridge_ads: false

# Should a DM room be created for every friend of the character? Rooms are created
# after connecting and when a new friendship is confirmed, once per friend: if you
# leave a friend's DM room, it isn't created again until you start a chat yourself.
create_friend_dms: true

# Should private messages to offline characters be kept and sent when they come online?
# F-Chat can only deliver messages to online characters. Up to 50 messages per character
# are kept, also across restarts of the bridge.
queue_offline_messages: true

# Should status changes of characters you have a DM with be posted into the DM room?
bridge_status_changes: false
# Should F-Chat server notices (SYS, invites, notes) be sent to your bridge management
# room? Broadcasts are sent to a private chat with the "F-Chat Broadcast" ghost.
bridge_notices: true

# Set your F-Chat status to "online" with this status message after connecting.
# Leave empty to not set a status message.
default_status_message: ""

# Set your F-Chat status to "idle" after this many minutes without activity on Matrix
# (sending messages, typing or reading messages in bridged rooms). The previous status comes
# back with your next activity. Only "online" and "looking" are changed. 0 disables it.
auto_idle_minutes: 0

# Should you get a notice when a friend or bookmarked character comes online? The notice is
# posted into the private chat with the character, or into the management room if there is
# none. Users can change it per character with the `online-alerts` command, and turn alerts on
# or off for single characters (also ones that aren't friends) in their private chats.
online_alerts: false

# Should the bridge load the F-List profiles of characters (gender, species, age,
# orientation, role, "currently looking for") for the biography of their Matrix profile?
# The biography also links to the F-List profile. Profiles are loaded at most once a week
# per character. Biography, pronouns and name color need a homeserver with custom profile
# fields (Matrix v1.16 / MSC4133) and `matrix: ghost_extra_profile_info: true` in the bridge
# section of this config.
fetch_character_profiles: true
# Should ghost profiles also get the com.beeper.bridge.* fields (remote ID, identifiers,
# network, ...)? They're only used by Beeper clients. When disabled, existing ones are removed.
beeper_profile_fields: false

# Remove ghost users that weren't seen for this many days and that nobody has a private
# chat with: they leave all rooms and their Matrix profile is cleared (an appservice can't
# delete Matrix accounts). They come back automatically if the character shows up again.
# Characters that go offline stay in the channel rooms; after being offline for this many
# days, they leave the channel rooms (private chats are kept).
# 0 disables the cleanup, and offline characters stay in the channel rooms.
ghost_cleanup_days: 0

# Should the F-Chat status of characters be shown as Matrix presence? Online and looking
# become "online", idle, away, busy and DND become "unavailable" (with the status message).
bridge_presence: true
# How often (in seconds) the presence of online characters is set again. Synapse resets the
# presence of users that don't sync after 30 seconds, so the bridge has to repeat it. Only
# members of synced channels and characters with a private chat are refreshed.
# 0 only sets the presence when it changes.
presence_refresh_seconds: 25
# Added to the names of offline characters, for homeservers that have presence disabled,
# e.g. " (offline)". Empty disables it.
offline_name_suffix: ""
